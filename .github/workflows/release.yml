name: release-artifacts

# Produces the shipped artifacts:
#   * the cgo-enabled binary (pikadump tag -> snapshot dump readers), for
#     users who do not want to build PikiwiDB's RocksDB deps themselves;
#   * the container image ghcr.io/jk-97/pikawire:<version> (tag pushes only).
# Default tagless Go builds are unaffected (see ci.yml).

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  binary:
    runs-on: ubuntu-24.04
    container:
      image: rockylinux/rockylinux:8
    steps:
      - name: Toolchain
        run: |
          dnf install -y gcc gcc-c++ make cmake git python3 \
            autoconf automake libtool unzip tar gzip which findutils file \
            && dnf clean all
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Cache PikiwiDB dep builds
        uses: actions/cache@v4
        with:
          path: ~/.cache/pikawire-pikiwidb
          key: pikiwidb-deps-el8-${{ runner.arch }}-v1

      - name: Build cgo binary (prepares pikiwidb deps per version)
        run: OUT=bin/pikawire-dbsync bash scripts/build-cgo.sh

      - name: Smoke test
        run: |
          file bin/pikawire-dbsync
          ./bin/pikawire-dbsync -c /nonexistent 2>&1 | grep -qi "config\|usage"
          ./bin/pikawire-dbsync -version | grep -q .

      - uses: actions/upload-artifact@v4
        with:
          name: pikawire-dbsync-el8-${{ runner.arch }}
          path: bin/pikawire-dbsync

  image:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: ver
        run: echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
      - name: Build
        run: docker build -t ghcr.io/jk-97/pikawire:${{ steps.ver.outputs.tag }} .
      - name: Push
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push ghcr.io/jk-97/pikawire:${{ steps.ver.outputs.tag }}
          docker tag ghcr.io/jk-97/pikawire:${{ steps.ver.outputs.tag }} \
                     ghcr.io/jk-97/pikawire:latest
          docker push ghcr.io/jk-97/pikawire:latest
